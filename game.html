<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --grid: #16213a;
    --snake-dark: #16803d;
    --snake-light: #86efac;
    --snake-head: #22c55e;
    --food: #f87171;
    --food-glow: #fca5a5;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }
  h1 {
    margin: 0;
    letter-spacing: 2px;
    font-size: 1.8rem;
  }
  #hud {
    display: flex;
    align-items: center;
    gap: 24px;
    font-size: 1.1rem;
  }
  #hud span { color: var(--accent); font-weight: bold; }
  #mute-btn {
    background: transparent;
    border: 2px solid var(--panel);
    color: var(--text);
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 1.1rem;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #mute-btn:hover { transform: scale(1.08); border-color: var(--accent); }
  #board-wrap {
    position: relative;
  }
  canvas {
    background: var(--grid);
    border: 3px solid var(--panel);
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(15, 23, 42, 0.85);
    border-radius: 8px;
    text-align: center;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; color: var(--food); }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 10px 22px;
    font-size: 1rem;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.1s ease;
  }
  button:hover { transform: scale(1.05); }
  #hint {
    font-size: 0.85rem;
    color: #94a3b8;
    max-width: 420px;
    text-align: center;
  }
  #touch-controls {
    display: none;
    grid-template-columns: repeat(3, 56px);
    grid-template-rows: repeat(3, 56px);
    gap: 6px;
  }
  #touch-controls button {
    width: 56px;
    height: 56px;
    font-size: 1.3rem;
    padding: 0;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch-controls { display: grid; }
  }
</style>
</head>
<body>
  <h1>🐍 SNAKE</h1>
  <div id="hud">
    <div>Score: <span id="score">0</span></div>
    <div>Best: <span id="best">0</span></div>
    <button id="mute-btn" title="Toggle sound">🔊</button>
  </div>

  <div id="board-wrap">
    <canvas id="board" width="400" height="400"></canvas>
    <div id="overlay">
      <h2 id="overlay-title">Ready?</h2>
      <p id="overlay-msg">Use arrow keys or WASD to move</p>
      <button id="start-btn">Start Game</button>
    </div>
  </div>

  <p id="hint">Arrow keys / WASD to move · Space to pause · Eat the apple to grow. Don't hit the walls or yourself!</p>

  <div id="touch-controls">
    <div></div><button data-dir="up">▲</button><div></div>
    <button data-dir="left">◀</button><div></div><button data-dir="right">▶</button>
    <div></div><button data-dir="down">▼</button><div></div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const cell = 20;
  const cols = canvas.width / cell;
  const rows = canvas.height / cell;

  // render canvas at device pixel ratio for crisp, smooth edges
  const cssSize = canvas.width;
  canvas.width = cssSize * dpr;
  canvas.height = cssSize * dpr;
  canvas.style.width = cssSize + 'px';
  canvas.style.height = cssSize + 'px';
  ctx.scale(dpr, dpr);

  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlay-title');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');
  const muteBtn = document.getElementById('mute-btn');

  const BEST_KEY = 'snake-best-score';
  const MUTE_KEY = 'snake-muted';
  let best = Number(localStorage.getItem(BEST_KEY)) || 0;
  bestEl.textContent = best;
  let muted = localStorage.getItem(MUTE_KEY) === '1';
  muteBtn.textContent = muted ? '🔇' : '🔊';

  // ---------- sound ----------
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function beep({ freq = 440, duration = 0.1, type = 'sine', endFreq = null, volume = 0.2, delay = 0 }) {
    if (muted) return;
    ensureAudio();
    const t0 = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (endFreq) osc.frequency.exponentialRampToValueAtTime(endFreq, t0 + duration);
    gain.gain.setValueAtTime(volume, t0);
    gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + duration + 0.02);
  }

  const sfx = {
    eat: () => beep({ freq: 520, endFreq: 900, duration: 0.12, type: 'square', volume: 0.18 }),
    turn: () => beep({ freq: 300, duration: 0.03, type: 'triangle', volume: 0.05 }),
    start: () => {
      beep({ freq: 330, duration: 0.09, type: 'sine', volume: 0.15 });
      beep({ freq: 440, duration: 0.09, type: 'sine', volume: 0.15, delay: 0.09 });
      beep({ freq: 660, duration: 0.12, type: 'sine', volume: 0.15, delay: 0.18 });
    },
    gameOver: () => {
      beep({ freq: 300, endFreq: 90, duration: 0.4, type: 'sawtooth', volume: 0.2 });
    },
  };

  muteBtn.addEventListener('click', () => {
    muted = !muted;
    localStorage.setItem(MUTE_KEY, muted ? '1' : '0');
    muteBtn.textContent = muted ? '🔇' : '🔊';
    if (!muted) { ensureAudio(); beep({ freq: 500, duration: 0.05, volume: 0.1 }); }
  });

  // ---------- game state ----------
  let snake, prevSnake, dir, nextDir, food, score, speedMs, timer, running, paused;
  let lastStepTime = 0;
  let rafId = null;

  function reset() {
    snake = [
      { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
      { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) },
    ];
    prevSnake = snake.map(s => ({ ...s }));
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    speedMs = 200;
    paused = false;
    scoreEl.textContent = score;
    placeFood();
    lastStepTime = performance.now();
  }

  function placeFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * cols),
        y: Math.floor(Math.random() * rows),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function lerp(a, b, t) { return a + (b - a) * t; }

  function roundRectPath(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function draw(alpha) {
    ctx.clearRect(0, 0, cssSize, cssSize);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= cols; i++) {
      ctx.beginPath();
      ctx.moveTo(i * cell, 0);
      ctx.lineTo(i * cell, cssSize);
      ctx.stroke();
    }
    for (let j = 0; j <= rows; j++) {
      ctx.beginPath();
      ctx.moveTo(0, j * cell);
      ctx.lineTo(cssSize, j * cell);
      ctx.stroke();
    }

    // food — a little apple, gently bobbing
    const bob = Math.sin(performance.now() / 260) * 1.2;
    const fx = food.x * cell + cell / 2;
    const fy = food.y * cell + cell / 2 + bob;
    const appleR = cell / 2 - 3;

    // soft glow behind it
    const glow = ctx.createRadialGradient(fx, fy, 1, fx, fy, appleR + 7);
    glow.addColorStop(0, getCss('--food-glow'));
    glow.addColorStop(1, 'rgba(248,113,113,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx, fy, appleR + 7, 0, Math.PI * 2);
    ctx.fill();

    // apple body with shading (darker red, highlight on upper-left)
    const bodyGrad = ctx.createRadialGradient(
      fx - appleR * 0.4, fy - appleR * 0.4, 1,
      fx, fy, appleR * 1.3
    );
    bodyGrad.addColorStop(0, '#fecaca');
    bodyGrad.addColorStop(0.4, getCss('--food'));
    bodyGrad.addColorStop(1, '#b91c1c');
    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    // slight heart-like dip at the top for an apple silhouette
    ctx.arc(fx, fy + appleR * 0.1, appleR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx - appleR * 0.35, fy - appleR * 0.45, appleR * 0.4, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(fx + appleR * 0.35, fy - appleR * 0.45, appleR * 0.4, 0, Math.PI * 2);
    ctx.fill();

    // small shine
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.ellipse(fx - appleR * 0.35, fy - appleR * 0.15, appleR * 0.22, appleR * 0.32, -0.5, 0, Math.PI * 2);
    ctx.fill();

    // stem
    ctx.strokeStyle = '#7c4a1e';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(fx, fy - appleR * 0.9);
    ctx.quadraticCurveTo(fx + 1.5, fy - appleR * 1.3, fx + 0.5, fy - appleR * 1.6);
    ctx.stroke();

    // leaf
    ctx.fillStyle = '#4ade80';
    ctx.beginPath();
    ctx.ellipse(fx + appleR * 0.7, fy - appleR * 1.15, appleR * 0.4, appleR * 0.22, -0.6, 0, Math.PI * 2);
    ctx.fill();

    // interpolated snake positions
    const n = snake.length;
    const points = new Array(n);
    for (let i = 0; i < n; i++) {
      const cur = snake[i];
      const prev = i === 0 ? prevSnake[0] : (prevSnake[i - 1] || cur);
      // avoid interpolating across a wrap/teleport-sized jump
      const dx = cur.x - prev.x, dy = cur.y - prev.y;
      const jumpTooFar = Math.abs(dx) > 1 || Math.abs(dy) > 1;
      points[i] = jumpTooFar
        ? { x: cur.x, y: cur.y }
        : { x: lerp(prev.x, cur.x, alpha), y: lerp(prev.y, cur.y, alpha) };
    }

    // body: smooth connected ribbon using rounded segments + gradient
    for (let i = n - 1; i >= 0; i--) {
      const p = points[i];
      const t = n <= 1 ? 0 : i / (n - 1);
      const size = cell - 2 - t * 4; // taper toward tail
      const cx = p.x * cell + cell / 2;
      const cy = p.y * cell + cell / 2;
      const shade = lerp(0, 1, t);
      ctx.fillStyle = i === 0 ? getCss('--snake-head') : mixColor(getCss('--snake-light'), getCss('--snake-dark'), shade);
      roundRectPath(cx - size / 2, cy - size / 2, size, size, size / 3);
      ctx.fill();
    }

    // head details: eyes + tongue oriented with direction
    const headP = points[0];
    const hx = headP.x * cell + cell / 2;
    const hy = headP.y * cell + cell / 2;
    const d = running && !paused ? nextDir : dir;
    const ex = d.x, ey = d.y;
    const perpX = -ey, perpY = ex;
    const eyeOffset = 4.5;
    const eyeForward = 3;
    [-1, 1].forEach(side => {
      const eyeX = hx + ex * eyeForward + perpX * eyeOffset * side;
      const eyeY = hy + ey * eyeForward + perpY * eyeOffset * side;
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(eyeX, eyeY, 2.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(eyeX - ex * 0.6, eyeY - ey * 0.6, 0.8, 0, Math.PI * 2);
      ctx.fill();
    });

    // flicking tongue
    if (running && !paused) {
      const flick = Math.sin(performance.now() / 90) > 0.4;
      if (flick) {
        const tx = hx + ex * (cell / 2);
        const ty = hy + ey * (cell / 2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(hx + ex * (cell / 2 - 2), hy + ey * (cell / 2 - 2));
        ctx.lineTo(tx + ex * 4, ty + ey * 4);
        ctx.moveTo(tx + ex * 4, ty + ey * 4);
        ctx.lineTo(tx + ex * 4 + perpX * 2, ty + ey * 4 + perpY * 2);
        ctx.moveTo(tx + ex * 4, ty + ey * 4);
        ctx.lineTo(tx + ex * 4 - perpX * 2, ty + ey * 4 - perpY * 2);
        ctx.stroke();
      }
    }
  }

  function getCss(name) {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  }

  function mixColor(c1, c2, t) {
    const a = hexToRgb(c1), b = hexToRgb(c2);
    const r = Math.round(lerp(a.r, b.r, t));
    const g = Math.round(lerp(a.g, b.g, t));
    const bl = Math.round(lerp(a.b, b.b, t));
    return `rgb(${r},${g},${bl})`;
  }

  function hexToRgb(hex) {
    hex = hex.replace('#', '');
    if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
    const num = parseInt(hex, 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function step() {
    if (paused) return;
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= cols ||
      head.y < 0 || head.y >= rows ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      gameOver();
      return;
    }

    prevSnake = snake.map(s => ({ ...s }));
    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      sfx.eat();
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem(BEST_KEY, best);
      }
      placeFood();
      if (speedMs > 110) {
        speedMs -= 3;
        restartTimer();
      }
    } else {
      snake.pop();
    }

    lastStepTime = performance.now();
  }

  function restartTimer() {
    clearInterval(timer);
    timer = setInterval(step, speedMs);
  }

  function renderLoop() {
    if (running) {
      const alpha = paused ? 1 : Math.min((performance.now() - lastStepTime) / speedMs, 1);
      draw(alpha);
    }
    rafId = requestAnimationFrame(renderLoop);
  }

  function gameOver() {
    running = false;
    clearInterval(timer);
    sfx.gameOver();
    overlayTitle.textContent = 'Game Over';
    overlayMsg.textContent = `Score: ${score} — Best: ${best}`;
    startBtn.textContent = 'Play Again';
    overlay.classList.remove('hidden');
  }

  function startGame() {
    ensureAudio();
    reset();
    running = true;
    overlay.classList.add('hidden');
    sfx.start();
    restartTimer();
  }

  startBtn.addEventListener('click', startGame);

  const keyMap = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
  };

  function trySetDir(newDir) {
    if (!running || paused) return;
    // prevent reversing directly into itself
    if (newDir.x === -dir.x && newDir.y === -dir.y) return;
    if (newDir.x === nextDir.x && newDir.y === nextDir.y) return;
    nextDir = newDir;
    sfx.turn();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      if (running) paused = !paused;
      if (paused) lastStepTime = performance.now();
      e.preventDefault();
      return;
    }
    const newDir = keyMap[e.key];
    if (newDir) {
      trySetDir(newDir);
      e.preventDefault();
    }
  });

  document.querySelectorAll('#touch-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      const map = {
        up: { x: 0, y: -1 },
        down: { x: 0, y: 1 },
        left: { x: -1, y: 0 },
        right: { x: 1, y: 0 },
      };
      trySetDir(map[btn.dataset.dir]);
    });
  });

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.x;
    const dy = t.clientY - touchStart.y;
    if (Math.abs(dx) > Math.abs(dy)) {
      trySetDir(dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 });
    } else {
      trySetDir(dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 });
    }
    touchStart = null;
  });

  reset();
  draw(1);
  renderLoop();
})();
</script>
</body>
</html>
